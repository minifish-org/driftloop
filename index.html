<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>driftloop — generative music</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="description" content="Generative lofi / ambient / jazz / classical, synthesised live in your browser. Offline-capable.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="public/icons/icon.svg">
<link rel="apple-touch-icon" href="public/icons/icon.svg">

<!-- iOS standalone app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="driftloop">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1d1d1f;
    --muted: #6b6b6b;
    --bg: #fafafa;
    --border: #d8d8d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --bg: #131313;
      --border: #303030;
    }
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    max-width: 600px;
    margin: 48px auto;
    padding: 24px;
    line-height: 1.5;
  }

  h1 {
    font-weight: 500;
    font-size: 32px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }

  .genres {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 0 0 24px;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 24px;
  }
  .transport button { flex: 1; min-width: 80px; }

  button {
    font-size: 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    border-radius: 6px;
    font-family: inherit;
    transition: background 0.12s, border-color 0.12s, color 0.12s, opacity 0.12s;
  }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }

  /* Filled style for the primary action and the currently-selected genre.
     Same treatment unifies "this is what's happening" across the page. */
  .genre[aria-pressed="true"],
  #play {
    background: var(--fg);
    border-color: var(--fg);
    color: var(--bg);
  }
  /* Play stays visually primary even when disabled (during play). */
  #play:disabled { opacity: 0.35; }

  #status {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 32px;
    min-height: 1.5em;
  }

  footer {
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  footer a { color: inherit; }
  .version {
    display: inline-block;
    margin-left: 12px;
    opacity: 0.6;
  }
</style>
</head>
<body>

<h1>driftloop</h1>
<p class="subtitle">Generative music, synthesised live in your browser.</p>

<div class="genres" id="genres">
  <button class="genre" data-genre="lofi"      aria-pressed="false">lofi</button>
  <button class="genre" data-genre="ambient"   aria-pressed="false">ambient</button>
  <button class="genre" data-genre="jazz"      aria-pressed="false">jazz</button>
  <button class="genre" data-genre="classical" aria-pressed="false">classical</button>
</div>

<div class="transport">
  <button id="play">play</button>
  <button id="stop" disabled>stop</button>
  <button id="next">new</button>
  <button id="lead">melody: off</button>
</div>

<div id="status" role="status" aria-live="polite"></div>

<footer>
  Built with FluidSynth-WASM and MuseScore General Lite. See <a href="README.md">README</a>.
  <span id="version" class="version"></span>
</footer>

<!-- js-synthesizer ships as UMD globals. Order matters: the WASM loader
     must run before the JS wrapper. Vendored locally from
     unpkg.com/js-synthesizer@1.8.5 to avoid a CDN single-point-of-failure
     and to make the app fully self-hosted on Cloudflare Pages. -->
<script src="vendor/js-synthesizer/libfluidsynth.js"></script>
<script src="vendor/js-synthesizer/js-synthesizer.js"></script>

<script type="module" src="src/ui/app.js"></script>

</body>
</html>
